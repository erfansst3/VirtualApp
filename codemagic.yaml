workflows:
  android-build:
    name: Android Debug Build
    max_build_duration: 30

    environment:
      java: 8

    scripts:
      - name: Build APK
        script: |
          chmod +x VirtualApp/gradlew
          cd VirtualApp
          ./gradlew assembleDebug

    artifacts:
      - "VirtualApp/**/build/outputs/apk/**/*.apk"

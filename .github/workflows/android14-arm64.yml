name: Android 14 ARM64 GMS
on:
  workflow_dispatch:
  push:
    branches: [android14-gms-arm64]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - uses: android-actions/setup-ndk@v3
        with:
          ndk-version: 25.2.9519653
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: gradle -p VirtualApp assembleDebug
      - run: unzip -l VirtualApp/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libva++.so'
      - uses: actions/upload-artifact@v4
        with:
          name: virtualapp-arm64-debug
          path: VirtualApp/app/build/outputs/apk/debug/app-debug.apk

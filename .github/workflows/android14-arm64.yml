name: Android 14 ARM64 GMS
on:
  workflow_dispatch:
  push:
    branches: [android14-gms-arm64]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          gradle -p VirtualApp assembleDebug
          unzip -l VirtualApp/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/'
      - uses: actions/upload-artifact@v4
        with:
          name: virtualapp-arm64-debug
          path: VirtualApp/app/build/outputs/apk/debug/app-debug.apk

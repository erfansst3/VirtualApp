buildscript {
    repositories { google(); mavenCentral(); jcenter() }
    dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
}
allprojects {
    repositories { google(); mavenCentral(); jcenter(); maven { url 'https://jitpack.io' } }
}
tasks.register("clean", Delete) { delete rootProject.buildDir }